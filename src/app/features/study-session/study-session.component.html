<div class="study-container" *ngIf="studySessionDetails">
  <h2>{{ studySessionDetails.conceptName }}</h2>
  <p class="meta">
    <strong>Subject:</strong> {{ studySessionDetails.subjectName || 'N/A' }} |
    <strong>Category:</strong> {{ studySessionDetails.categoryName || 'N/A' }}
  </p>

  <div class="description">
    <h4>Description</h4>
    <p>{{ studySessionDetails.conceptDescription || 'No description available.' }}</p>
  </div>

  <div class="timer-section">
    <div class="clock-container">
      <div class="clock">
        <span>{{ formattedTime }}</span>
      </div>
      <div class="timer-controls">
        <button (click)="startTimer()" [disabled]="timer <= 0 || isRunning" mat-fab color="primary" aria-label="Start Timer">
          <mat-icon>play_arrow</mat-icon>
        </button>
        <button (click)="stopTimer()" [disabled]="timer <= 0 || !isRunning" mat-fab color="warn" aria-label="Stop Timer">
          <mat-icon>pause</mat-icon>
        </button>
      </div>
    </div>

    <mat-form-field class="comment-field" appearance="outline">
      <mat-label>Add your notes</mat-label>
      <textarea matInput [(ngModel)]="userComment" rows="3"></textarea>
    </mat-form-field>
  </div>

  <div class="actions">
    <button (click)="markStatus(conceptStatus.InProgress)" mat-raised-button color="primary">
      <mat-icon>hourglass_top</mat-icon>
      Mark In Progress
    </button>
    <button (click)="markStatus(conceptStatus.Complete)" mat-raised-button color="accent">
      <mat-icon>check_circle</mat-icon>
      Mark Completed
    </button>
  </div>
</div>
