 <!-- Today's Concepts -->
<mat-card class="concepts-card">
  <mat-card-header>
    <mat-card-title><h3>Today's Agenda</h3></mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div *ngFor="let concept of todaysConcepts" class="concept-item">
      <div class="concept-info">
        <h3>{{ concept.name }}</h3>
        <p class="subject-meta">
          <span class="subject-badge">{{ concept.subject }}</span>
          <span class="duration">• {{ concept.duration }}</span>
        </p>
      </div>
      <button mat-flat-button color="primary" class="start-btn">
        <mat-icon>play_arrow</mat-icon>
        Start
      </button>
    </div>
  </mat-card-content>
</mat-card>

<!-- Quick Actions -->
<div class="quick-actions">
  <button mat-button color="accent" class="view-all">
    <mat-icon>calendar_today</mat-icon>
    View Full Schedule
  </button>
  <button mat-raised-button class="action-button" (click)="addNewConcept()">
    <mat-icon>add</mat-icon>
    Add New Concept
  </button>
  <button mat-raised-button class="action-button" (click)="planWeek()">
    <mat-icon>schedule</mat-icon>
    Plan Week
  </button>
</div>

  <!-- Reminder -->
  <mat-card class="reminder-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>notifications</mat-icon>
      <mat-card-title>Reminder</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      "{{ reminderText }}"
    </mat-card-content>
  </mat-card>
</div>
